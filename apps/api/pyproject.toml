[project]
name = "mesa-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<6",
    "djangorestframework>=3.16",
    "drf-spectacular>=0.28",
    "dj-database-url>=2.3",
    "psycopg[binary]>=3.2",
    "gunicorn>=23",
    "whitenoise>=6.9",
    "resend>=2.10",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-django>=4.9", "pyyaml>=6"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
filterwarnings = ["ignore:No directory at"]
python_files = ["test_*.py"]
