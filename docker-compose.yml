# La base de datos es EXTERNA: define DATABASE_URL en apps/api/.env (ver .env.example). No hay servicio de BD aquí.
services:
  api:
    build: ./apps/api
    env_file: ./apps/api/.env
    restart: unless-stopped
    extra_hosts: ["host.docker.internal:host-gateway"] # permite una BD en el propio host también en Linux
    ports:
      - "127.0.0.1:8000:8000" # admin interno (/admin) solo desde la máquina local
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 2)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s # migrate corre antes de gunicorn
  web:
    build:
      context: ./apps/web
      args:
        API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
